<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gestor Supermercado">
  <title>Gestor Supermercado</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:#09090f;color:#f5f5f7;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
    button,input{font:inherit}.app{width:100%;max-width:700px;margin:auto;min-height:100vh;padding-bottom:90px}
    header{position:sticky;top:0;z-index:20;background:rgba(9,9,15,.94);backdrop-filter:blur(18px);padding:18px 16px 12px;border-bottom:1px solid #20202a}
    .header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:24px;letter-spacing:-.5px}
    .subtitle{margin-top:4px;color:#8e8e9a;font-size:13px}.icon-btn{width:42px;height:42px;border:0;border-radius:13px;background:#181820;color:#fff;font-size:22px;cursor:pointer}
    .search{margin-top:14px;width:100%;height:44px;border:1px solid #272733;border-radius:13px;outline:none;background:#12121a;color:#fff;padding:0 14px}
    .search:focus{border-color:#5656ff}main{padding:18px 16px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .section-title h2{margin:0;font-size:18px}.count{color:#858592;font-size:12px}.provider-list,.product-list{display:flex;flex-direction:column;gap:10px}
    .provider-card{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;border:1px solid #24242f;border-radius:16px;background:#111118;color:#fff;cursor:pointer;text-align:left;transition:.15s}
    .provider-card:active{transform:scale(.98);background:#181821}.provider-left{display:flex;align-items:center;gap:13px}
    .provider-icon{width:45px;height:45px;border-radius:13px;background:#1d1d29;display:flex;align-items:center;justify-content:center;font-size:20px}
    .provider-name{font-weight:700;font-size:16px}.provider-info{color:#858592;font-size:12px;margin-top:3px}.arrow{color:#777784;font-size:21px}
    .back-btn{border:0;background:transparent;color:#8d8dff;padding:0;margin-bottom:14px;font-size:14px;cursor:pointer}
    .provider-heading{margin-bottom:18px}.provider-heading h2{margin:0;font-size:23px}.provider-heading p{margin:5px 0 0;color:#858592;font-size:13px}
    .product-card{background:#111118;border:1px solid #24242f;border-radius:15px;padding:14px}.product-card.low{border-color:#673d32;background:#17120f}
    .product-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.product-name{font-weight:700;font-size:15px;line-height:1.3}
    .stock-status{font-size:11px;margin-top:5px;color:#858592}.stock-status.low{color:#ff9a76}.stock-status.ok{color:#82d69b}

    .product-settings-btn{width:36px;height:36px;flex-shrink:0;border:0;border-radius:10px;background:#20202b;color:#b8b8c4;font-size:18px;cursor:pointer}.product-settings-btn:active{background:#2b2b38}
    .product-menu-btn{width:100%;height:46px;border:0;border-radius:11px;background:#25252f;color:#fff;margin-top:10px;text-align:left;padding:0 14px;cursor:pointer}.product-menu-btn.edit{background:#5d5df6}.product-menu-btn.delete{background:#4c2525}
    .weekly-used{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#858592;font-size:12px}.weekly-used input{width:90px;height:32px;background:#0d0d13;border:1px solid #292934;border-radius:8px;color:#fff;text-align:center;outline:none}
    .stock-controls{display:flex;align-items:center;gap:8px;margin-top:13px}.stock-btn{width:40px;height:40px;border:0;border-radius:11px;background:#20202b;color:#fff;font-size:21px;cursor:pointer}
    .stock-input{flex:1;min-width:0;height:40px;border:1px solid #292934;border-radius:11px;background:#0d0d13;color:#fff;text-align:center;outline:none}
    .recommended{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#858592;font-size:12px}
    .recommended input{width:90px;height:32px;background:#0d0d13;border:1px solid #292934;border-radius:8px;color:#fff;text-align:center;outline:none}
    .empty{padding:45px 20px;text-align:center;color:#777784}.empty-icon{font-size:40px;margin-bottom:10px}
    .fab{position:fixed;right:18px;bottom:20px;z-index:30;width:58px;height:58px;border:0;border-radius:50%;background:#5d5df6;color:#fff;font-size:28px;box-shadow:0 8px 30px rgba(0,0,0,.45);cursor:pointer}
    .modal-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.68);display:none;align-items:flex-end;justify-content:center}
    .modal-bg.active{display:flex}.modal{width:100%;max-width:700px;background:#13131b;border-radius:22px 22px 0 0;padding:20px;border-top:1px solid #292934}
    .modal h3{margin:0 0 18px;font-size:19px}.modal input{width:100%;height:46px;border:1px solid #30303b;border-radius:12px;background:#0d0d13;color:#fff;padding:0 13px;outline:none;margin-bottom:12px}
    .modal-actions{display:flex;gap:10px}.modal-actions button{flex:1;height:44px;border:0;border-radius:11px;cursor:pointer}.cancel{background:#25252f;color:#fff}.confirm{background:#5d5df6;color:#fff}
    .settings-card{background:#111118;border:1px solid #24242f;border-radius:15px;padding:16px}.settings-card button{width:100%;height:44px;border:0;border-radius:10px;background:#25252f;color:#fff;margin-top:10px;cursor:pointer}.danger{background:#4c2525!important}
    @media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:20px;max-width:500px}.fab{right:calc(50% - 330px)}}
  </style>
</head>
<body>
<div class="app">
<header>
  <div class="header-top">
    <div><h1>Gestor Supermercado</h1><div class="subtitle">Control personal de stock</div></div>
    <button class="icon-btn" onclick="openSettings()">⚙</button>
  </div>
  <input id="search" class="search" type="search" placeholder="Buscar proveedor o producto..." oninput="render()">
</header>
<main id="app"></main>
</div>
<button class="fab" onclick="openAddModal()">+</button>
<div id="modalBg" class="modal-bg" onclick="closeModalOutside(event)"><div class="modal" id="modalContent"></div></div>

<script>
const INITIAL_DATA={
  "Parnor":{products:[{name:"Mantecadas",stock:0,recommended:0}]},
  "Cilo":{products:[]},
  "9 Oro":{products:[]},
  "Trio":{products:[
    "Pepas","Pepas Mini","Pepas Vegetal","Pepas Chocotrío","Pepas Alemanas","Pepas Con Chips","Peponas",
    "Frolitas Membrillo","Tartelette / Tartelettes Frutilla","Tartelette Frutos del Bosque",
    "Marquise Frutos del Bosque","Trichoc","Trichips","Chocolatina","Scons","Krumiri","Lingüini",
    "Anillos Limón","Anillos Coco","Glasy","Besitos","Oskito","Surtidas Variette"
  ].map(name=>({name,stock:0,recommended:0}))},
  "Granix":{products:[]}
};

let data=JSON.parse(localStorage.getItem("gestor_supermercado"));
if(!data){data=INITIAL_DATA;saveData()}
// Mantiene los datos existentes y agrega el nuevo campo de consumo semanal.
Object.keys(data).forEach(provider=>{
  if(!data[provider].products)data[provider].products=[];
  data[provider].products.forEach(product=>{
    if(product.stock===undefined)product.stock=0;
    if(product.recommended===undefined)product.recommended=0;
    if(product.usedWeekly===undefined)product.usedWeekly=0;
  });
});
function saveData(){localStorage.setItem("gestor_supermercado",JSON.stringify(data))}
let currentProvider=null;

function render(){
  const app=document.getElementById("app"),search=document.getElementById("search").value.trim().toLowerCase();
  if(currentProvider!==null){renderProvider(currentProvider,search);return}
  let providers=Object.keys(data);
  if(search)providers=providers.filter(p=>p.toLowerCase().includes(search)||data[p].products.some(x=>x.name.toLowerCase().includes(search)));
  let html=`<div class="section-title"><h2>Proveedores</h2><span class="count">${Object.keys(data).length}</span></div><div class="provider-list">`;
  if(!providers.length)html+=`<div class="empty"><div class="empty-icon">🔎</div>No se encontraron resultados.</div>`;
  else providers.forEach(provider=>{html+=`<button class="provider-card" onclick="openProvider('${escapeQuotes(provider)}')"><div class="provider-left"><div class="provider-icon">📦</div><div><div class="provider-name">${escapeHtml(provider)}</div><div class="provider-info">${data[provider].products.length} ${data[provider].products.length===1?"producto":"productos"}</div></div></div><div class="arrow">›</div></button>`});
  html+=`</div>`;app.innerHTML=html;
}
function openProvider(provider){currentProvider=provider;document.getElementById("search").value="";render()}
function renderProvider(provider,search=""){
  const app=document.getElementById("app");if(!data[provider]){currentProvider=null;render();return}
  let products=data[provider].products;if(search)products=products.filter(x=>x.name.toLowerCase().includes(search));
  let html=`<button class="back-btn" onclick="goBack()">← Volver a proveedores</button><div class="provider-heading"><h2>${escapeHtml(provider)}</h2><p>Stock actual del depósito</p></div><div class="product-list">`;
  if(!products.length)html+=`<div class="empty"><div class="empty-icon">📦</div>Este proveedor todavía no tiene productos cargados.</div>`;
  else products.forEach((product,index)=>{
    if(product.usedWeekly===undefined)product.usedWeekly=0;
    const low=Number(product.stock)<Number(product.recommended),status=low?"low":"ok",statusText=low?"Stock por debajo de lo recomendable":"Stock correcto";
    html+=`<div class="product-card ${low?"low":""}"><div class="product-top"><div><div class="product-name">${escapeHtml(product.name)}</div><div class="stock-status ${status}">${statusText}</div></div><button class="product-settings-btn" title="Ajustes del producto" onclick="openProductSettings('${escapeQuotes(provider)}',${index})">⚙</button></div>
    <div class="stock-controls"><button class="stock-btn" onclick="changeStock('${escapeQuotes(provider)}',${index},-1)">−</button><input class="stock-input" type="number" min="0" value="${product.stock}" onchange="setStock('${escapeQuotes(provider)}',${index},this.value)"><button class="stock-btn" onclick="changeStock('${escapeQuotes(provider)}',${index},1)">+</button></div>
    <div class="weekly-used"><span>Bultos usados en la semana</span><input type="number" min="0" value="${product.usedWeekly}" onchange="setWeeklyUsed('${escapeQuotes(provider)}',${index},this.value)"></div>
    <div class="recommended"><span>Stock recomendable</span><input type="number" min="0" value="${product.recommended}" onchange="setRecommended('${escapeQuotes(provider)}',${index},this.value)"></div></div>`;
  });
  html+=`</div>`;app.innerHTML=html;
}
function changeStock(provider,index,amount){let current=Number(data[provider].products[index].stock)||0;current=Math.max(0,current+amount);data[provider].products[index].stock=current;saveData();render()}
function setStock(provider,index,value){let amount=Number(value);if(isNaN(amount)||amount<0)amount=0;data[provider].products[index].stock=amount;saveData();render()}
function setRecommended(provider,index,value){let amount=Number(value);if(isNaN(amount)||amount<0)amount=0;data[provider].products[index].recommended=amount;saveData();render()}
function setWeeklyUsed(provider,index,value){let amount=Number(value);if(isNaN(amount)||amount<0)amount=0;data[provider].products[index].usedWeekly=amount;saveData();render()}
function goBack(){currentProvider=null;document.getElementById("search").value="";render()}

function openProductSettings(provider,index){
  const product=data[provider].products[index];if(!product)return;
  document.getElementById("modalContent").innerHTML=`<h3>Ajustes del producto</h3><div class="settings-card"><strong>${escapeHtml(product.name)}</strong><button class="product-menu-btn edit" onclick="openEditProduct('${escapeQuotes(provider)}',${index})">✏️ Editar nombre</button><button class="product-menu-btn delete" onclick="deleteProduct('${escapeQuotes(provider)}',${index})">🗑️ Eliminar producto</button></div><div style="margin-top:14px"><button class="cancel" style="width:100%;height:44px;border:0;border-radius:11px;color:white" onclick="closeModal()">Cancelar</button></div>`;
  document.getElementById("modalBg").classList.add("active");
}
function openEditProduct(provider,index){
  const product=data[provider].products[index];if(!product)return;
  document.getElementById("modalContent").innerHTML=`<h3>Editar producto</h3><input id="editProductName" type="text" value="${escapeHtml(product.name)}" autocomplete="off"><div class="modal-actions"><button class="cancel" onclick="openProductSettings('${escapeQuotes(provider)}',${index})">Cancelar</button><button class="confirm" onclick="saveProductName('${escapeQuotes(provider)}',${index})">Guardar</button></div>`;
  document.getElementById("modalBg").classList.add("active");
  setTimeout(()=>{const input=document.getElementById("editProductName");if(input){input.focus();input.select()}},50);
}
function saveProductName(provider,index){
  const input=document.getElementById("editProductName");if(!input)return;const newName=input.value.trim();
  if(!newName){alert("El nombre del producto no puede quedar vacío.");return}
  const duplicate=data[provider].products.some((product,i)=>i!==index&&product.name.trim().toLowerCase()===newName.toLowerCase());
  if(duplicate){alert("Ya existe un producto con ese nombre en este proveedor.");return}
  data[provider].products[index].name=newName;saveData();closeModal();render();
}
function deleteProduct(provider,index){
  const product=data[provider].products[index];if(!product)return;
  if(!confirm(`¿Querés eliminar "${product.name}"?\n\nSe eliminará también su stock, consumo semanal y stock recomendable.`))return;
  data[provider].products.splice(index,1);saveData();closeModal();render();
}

function openAddModal(){
  document.getElementById("modalContent").innerHTML=currentProvider===null?
  `<h3>Agregar proveedor</h3><input id="newProvider" placeholder="Nombre del proveedor" autocomplete="off"><div class="modal-actions"><button class="cancel" onclick="closeModal()">Cancelar</button><button class="confirm" onclick="addProvider()">Agregar</button></div>`:
  `<h3>Agregar producto</h3><input id="newProduct" placeholder="Nombre del producto" autocomplete="off"><input id="newRecommended" type="number" min="0" placeholder="Stock recomendable"><div class="modal-actions"><button class="cancel" onclick="closeModal()">Cancelar</button><button class="confirm" onclick="addProduct()">Agregar</button></div>`;
  document.getElementById("modalBg").classList.add("active");
}
function closeModal(){document.getElementById("modalBg").classList.remove("active")}
function closeModalOutside(event){if(event.target.id==="modalBg")closeModal()}
function addProvider(){const name=document.getElementById("newProvider").value.trim();if(!name)return;if(data[name]){alert("Ese proveedor ya existe.");return}data[name]={products:[]};saveData();closeModal();render()}
function addProduct(){const name=document.getElementById("newProduct").value.trim();let recommended=Number(document.getElementById("newRecommended").value);if(!name)return;if(isNaN(recommended)||recommended<0)recommended=0;data[currentProvider].products.push({name,stock:0,usedWeekly:0,recommended});saveData();closeModal();render()}

function openSettings(){
  document.getElementById("modalContent").innerHTML=`<h3>Configuración</h3><div class="settings-card"><strong>Gestor Supermercado</strong><p style="color:#858592;font-size:13px;">Los datos se guardan solamente en este dispositivo.</p><button onclick="exportData()">📤 Exportar datos</button><button onclick="importData()">📥 Importar datos</button><button class="danger" onclick="resetData()">🗑 Restablecer aplicación</button></div><div style="margin-top:14px;"><button class="cancel" style="width:100%;height:44px;border:0;border-radius:11px;color:white;" onclick="closeModal()">Cerrar</button></div>`;
  document.getElementById("modalBg").classList.add("active");
}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="gestor-supermercado-backup.json";a.click();URL.revokeObjectURL(url)}
function importData(){const input=document.createElement("input");input.type="file";input.accept=".json";input.onchange=event=>{const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!imported||typeof imported!=="object")throw new Error();data=imported;saveData();currentProvider=null;closeModal();render();alert("Datos importados correctamente.")}catch{alert("El archivo no es válido.")}};reader.readAsText(file)};input.click()}
function resetData(){if(!confirm("¿Seguro que querés borrar todos los datos y volver al estado inicial?"))return;data=JSON.parse(JSON.stringify(INITIAL_DATA));saveData();currentProvider=null;closeModal();render()}
function escapeHtml(text){return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function escapeQuotes(text){return String(text).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
render();
</script>
</body>
</html>
